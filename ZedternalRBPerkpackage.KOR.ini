DeluxeSkillUpgradeDescription="<font color=\"#e80948\">화상 지속 피해</font> 배율이 <font color=\"#e85009\">+200%</font> 증가합니다."

[DKUpgrade_Skill_Cryosynthesis]
UpgradeName="극저온합성"
StandardSkillUpgradeDescription="각 웨이브 시작 시 <font color=\"#0bf1f1\">수류탄 2개</font>를 무료로 획득합니다. <font color=\"#15d7fa\">예비 탄약</font> 한도가 <font color=\"#15d7fa\">+20%</font> 증가합니다."
