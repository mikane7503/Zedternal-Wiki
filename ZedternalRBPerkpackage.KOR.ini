PerkUpgradeDescription5="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">적대적 인수</font> - 보스 등장 시 모든 팀원의 현재 <font color=\"#90EE90\">도쉬</font> 중 <font color=\"#FFFFFF\">+20%</font>를 흡수하여 자신의 것으로 만듭니다."
PerkUpgradeDescription6="<font color=\"#FFD700\">포트폴리오 성장</font>: 누적 <font color=\"#FFFFFF\">2500</font> <font color=\"#90EE90\">도쉬</font>를 획득할 때마다, 매 웨이브 종료 시 받는 기본 지원금이 영구적으로 <font color=\"#FFFFFF\">+50</font> 증가합니다."

