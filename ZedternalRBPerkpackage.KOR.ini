DeluxeSkillUpgradeDescription="표식 반경이 <font color=\"#FFD700\">1.5배</font> 증가하고, 최대 <font color=\"#FFD700\">12명</font>에게 표식을 남깁니다. 표식은 <font color=\"#FFFFFF\">30초</font> 후에 사라지며, 연쇄 폭발이 <font color=\"#FF4444\">한 번 더</font> 표식을 남길 수 있습니다."

[DKUpgrade_Skill_DanceOfDeath]
UpgradeName="죽음의 춤"
StandardSkillUpgradeDescription="<font color=\"#CC0000\">죽음의 춤:</font> 이동 중 가하는 피해량이 최대 <font color=\"#FFFFFF\">+20%</font> <font color=\"#FFD700\">증가</font>합니다. 보너스 수치는 현재 <font color=\"#66CCFF\">이동 속도에 비례</font>합니다. 제자리에 멈춰 서면 당신은 그저 필멸자일 뿐입니다."
DeluxeSkillUpgradeDescription="<font color=\"#CC0000\">죽음의 춤:</font> 이동 중 가하는 피해량이 최대 <font color=\"#FFFFFF\">+50%</font> <font color=\"#FFD700\">증가</font>합니다. 보너스 수치는 현재 <font color=\"#66CCFF\">이동 속도에 비례</font>합니다. 제자리에 멈춰 서면 당신은 그저 필멸자일 뿐입니다."

[DKUpgrade_Skill_DarkPact]
