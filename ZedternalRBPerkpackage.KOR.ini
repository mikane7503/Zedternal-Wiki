DeluxeSkillUpgradeDescription="체력이 +75% 미만인 적에게 +50%의 추가 피해를 줍니다."

[DKUpgrade_Skill_CrimsonBond]
UpgradeName="크림슨 본드"
StandardSkillUpgradeDescription="<font color=\"#B40028\">크림슨 본드:</font> 아군을 치유하면 <font color=\"#FFFFFF\">10초간</font> 혈연이 맺어집니다. 본인의 생명력 흡수 효과가 결속된 아군에게도 <font color=\"#FFFFFF\">+15%</font> 효율로 치유를 제공합니다."
DeluxeSkillUpgradeDescription="<font color=\"#FFD700\">[디럭스]</font> <font color=\"#B40028\">크림슨 본드:</font> 아군을 치유하면 <font color=\"#FFFFFF\">15초간</font> 혈연이 맺어집니다. 본인의 생명력 흡수 효과가 결속된 아군에게도 <font color=\"#FFFFFF\">+30%</font> 효율로 치유를 제공합니다."

[DKUpgrade_Skill_CrowdSurge]
UpgradeName="군중 밀집"
StandardSkillUpgradeDescription="<font color=\"#edb82a\">군중의 폭발:</font> 근접 공격으로 적을 처치하면 이동 속도 스택이 쌓입니다(최대 <font color=\"#FFFFFF\">5</font> 중첩, 스택당 <font color=\"#AAAAAA\">6초 지속</font>). 스택당: <font color=\"#32CD32\">이동 속도 2% 증가</font>. 3스택 이상: <font color=\"#FFD700\">은신한 적 감지 가능</font>. 5스택: <font color=\"#87CEEB\">무기 전환 속도 증가</font>."
DeluxeSkillUpgradeDescription="<font color=\"#edb82a\">군중의 폭발:</font> 근접 공격으로 적을 처치하면 이동 속도 스택이 쌓입니다(최대 <font color=\"#FFFFFF\">5</font> 중첩, 스택당 <font color=\"#AAAAAA\">9초 지속</font>). 스택당: <font color=\"#32CD32\">이동 속도 4% 증가</font>. 2스택 이상: <font color=\"#FFD700\">은신한 적 감지 가능</font>. 4스택: <font color=\"#87CEEB\">무기 전환 속도 증가</font>."

[DKUpgrade_Skill_Crucible]
UpgradeName="도가니"
