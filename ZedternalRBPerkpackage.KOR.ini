[DKUpgrade_Skill_CurseOfStone]
UpgradeName="돌의 저주"
StandardSkillUpgradeDescription="<font color=\"#8B008B\">돌의 저주:</font> 적 타격 시 <font color=\"#FFFFFF\">3% 확률</font>로 적에게 <font color=\"#FFD700\">저주</font>를 내립니다. 저주받은 적은 <font color=\"#FFFFFF\">5초</font> 동안 모든 출처로부터 <font color=\"#FF6666\">두 배의 피해</font>를 받습니다."
DeluxeSkillUpgradeDescription="<font color=\"#8B008B\">돌의 저주(디럭스):</font> 적 타격 시 <font color=\"#FFFFFF\">5% 확률</font>로 적에게 <font color=\"#FFD700\">저주</font>를 내립니다. 저주받은 적은 <font color=\"#FFFFFF\">5초</font> 동안 모든 출처로부터 <font color=\"#FF6666\">두 배의 피해</font>를 받습니다. <font color=\"#FFD700\">저주받은 적이 죽으면 주변 적에게 저주가 퍼집니다.</font>"

[DKUpgrade_Skill_DaisyChain]
