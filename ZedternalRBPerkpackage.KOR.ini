StandardSkillUpgradeDescription="팀원이 사망 후 부활할 때, 원래 소지했던 도쉬의 <font color=\"#ffaa33\">+25%</font>를 <font color=\"#00ff00\">보너스</font>로 들고 부활합니다. (당신의 개인 도쉬는 소모되지 않습니다)."
DeluxeSkillUpgradeDescription="팀원이 사망 후 부활할 때, 원래 소지했던 도쉬의 <font color=\"#ffaa33\">+50%</font>를 <font color=\"#00ff00\">보너스</font>로 들고 부활합니다. (당신의 개인 도쉬는 소모되지 않습니다)."

[DKUpgrade_Skill_Counterforce]
UpgradeName="반격력"
StandardSkillUpgradeDescription="<font color=\"#edb82a\">카운터포스:</font> 받는 피해를 저장합니다(<font color=\"#FF4500\">30%</font> 변환, 최대 <font color=\"#FFFFFF\">100</font> 누적). 다음번 <font color=\"#FF4500\">근접 공격</font> 시 저장된 피해량이 모두 방출되어 보너스 피해로 들어갑니다. <font color=\"#AAAAAA\">방출 후 10초의 재사용 대기시간이 있습니다.</font>"
DeluxeSkillUpgradeDescription="<font color=\"#edb82a\">카운터포스:</font> 받는 피해를 저장합니다(<font color=\"#FF4500\">70%</font> 변환, 최대 <font color=\"#FFFFFF\">200</font> 누적). 다음번 <font color=\"#FF4500\">근접 공격</font> 시 저장된 피해량이 모두 방출되어 보너스 피해로 들어갑니다. <font color=\"#AAAAAA\">방출 후 10초의 재사용 대기시간이 있습니다.</font>"

[DKUpgrade_Skill_Cremation]
UpgradeName="화장"
