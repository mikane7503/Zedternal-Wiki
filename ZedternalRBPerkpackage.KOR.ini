DeluxeSkillUpgradeDescription="<font color=\"#edb82a\">아드레날린 질주</font> 피해를 입을 때마다 <font color=\"#FFFFFF\">아드레날린</font> 스택이 쌓입니다 (최대 <font color=\"#FFFFFF\">8</font>). 스택당: <font color=\"#32CD32\">이동 속도 +3%</font>, <font color=\"#FFD700\">공격 속도 +3%</font>. 이 스택은 시간이 지남에 따라 감소합니다. <font color=\"#AAAAAA\">고통은 곧 연료입니다.</font>"

[DKUpgrade_Skill_AgonizingPresence]
