StandardSkillUpgradeDescription="<font color=\"#66cc00\">데드아이</font> 활성 능력을 잠금 해제합니다: <font color=\"#ffaa33\">10초</font> 동안 <font color=\"#00ffff\">헤드샷 피해가 25% 증가</font>합니다. 재사용 대기시간: <font color=\"#ff9900\">60초</font>."
DeluxeSkillUpgradeDescription="<font color=\"#66cc00\">데드아이(디럭스)</font> 활성 능력을 잠금 해제합니다: <font color=\"#ffaa33\">10초</font> 동안 <font color=\"#00ffff\">헤드샷 피해가 40% 증가</font>합니다. 재사용 대기시간: <font color=\"#ff9900\">60초</font>."

[DKUpgrade_Skill_DeadeyeMomentum]
UpgradeName="데드아이 모멘텀"
StandardSkillUpgradeDescription="연속으로 <font color=\"#66cc00\">헤드샷 처치</font> 시 스택당 <font color=\"#ff3399\">+5%</font>의 <font color=\"#66cc00\">피해량 보너스</font>를 얻습니다(최대 5스택). <font color=\"#be4d25\">헤드샷이 아닌 처치는 연속 스택을 초기화합니다.</font>"
DeluxeSkillUpgradeDescription="연속으로 <font color=\"#66cc00\">헤드샷 처치</font> 시 스택당 <font color=\"#ff3399\">+10%</font>의 <font color=\"#66cc00\">피해량 보너스</font>를 얻습니다(최대 5스택). <font color=\"#be4d25\">헤드샷이 아닌 처치는 연속 스택을 초기화합니다.</font>"

[DKUpgrade_Skill_Deadlock]
UpgradeName="교착 상태"
StandardSkillUpgradeDescription="<font color=\"#edb82a\">교착 상태:</font> 주변에 적이 <font color=\"#FFFFFF\">3명 이상</font> 있을 때 죽을 위기에 처할 경우, <font color=\"#DC143C\">1 HP</font>로 생존하고 <font color=\"#FFD700\">15초 동안 무적</font>이 됩니다. <font color=\"#AAAAAA\">웨이브당 1회 제한.</font>"
DeluxeSkillUpgradeDescription="<font color=\"#edb82a\">교착 상태:</font> 주변에 적이 <font color=\"#FFFFFF\">2명 이상</font> 있을 때 죽을 위기에 처할 경우, <font color=\"#DC143C\">1 HP</font>로 생존하고 <font color=\"#FFD700\">15초 동안 무적</font>이 됩니다. <font color=\"#AAAAAA\">웨이브당 1회 제한.</font>"

[DKUpgrade_Skill_Deadshot]
