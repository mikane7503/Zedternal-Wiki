PerkUpgradeDescription5="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">에이펙스 스토커</font> - 30초 이상 피해를 받지 않으면 다음 공격에 <font color=\"#FFFFFF\">+35%</font>의 <font color=\"#87CEEB\">피해량</font> 보너스가 적용됩니다."

