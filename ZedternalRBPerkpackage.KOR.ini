PerkUpgradeDescription1="<font color=\"#FF6600\">하이드라의 분노:</font> <font color=\"#FF9933\">연사 속도</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription2="<font color=\"#FF6600\">뱀의 일격:</font> <font color=\"#FF9933\">관통력</font> <font color=\"#FFFFFF\">레벨업당 +2.5% · 만렙(Lv20) +50%</font>"
PerkUpgradeDescription3="<font color=\"#FF6600\">무한 탄약:</font> <font color=\"#FF9933\">탄창 용량</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription4="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">트윈 스트라이크</font> - 공격 시 <font color=\"#FFFFFF\">25%</font> 확률로 <font color=\"#FF9933\">두 번 명중</font>합니다."
PerkUpgradeDescription5="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">분노 모드</font> - 75킬마다 <font color=\"#FFFFFF\">8초 동안</font> <font color=\"#FFFFFF\">분노 모드</font>가 발동합니다: 연사 속도 <font color=\"#FFFFFF\">+100%</font> 및 피해량 <font color=\"#FFFFFF\">3.3배</font>."

[DKUpgrade_Perk_Maniac]
UpgradeName="매니악"
PerkUpgradeDescription1="모든 <font color=\"#15d7fa\">수류탄 피해량</font>이 <font color=\"#77d914\">레벨업당 +20% · 만렙(Lv20) +400%</font> 증가합니다."
PerkUpgradeDescription2="모든 무기의 <font color=\"#15d7fa\">재장전 속도</font>가 <font color=\"#77d914\">레벨업당 +2.5% · 만렙(Lv20) +50%</font> 증가합니다."

[DKUpgrade_Perk_Medusa]
UpgradeName="메두사"
PerkUpgradeDescription1="<font color=\"#8B008B\">독성 정밀도:</font> <font color=\"#9966FF\">헤드샷 피해량</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription2="<font color=\"#8B008B\">뱀처럼 구불구불한 속도:</font> <font color=\"#9966FF\">재장전 속도</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription3="<font color=\"#8B008B\">독 비축량:</font> <font color=\"#9966FF\">여분 탄약</font> <font color=\"#FFFFFF\">레벨업당 +1.5% · 만렙(Lv20) +30%</font>"
PerkUpgradeDescription4="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">독의 손길</font> - 모든 공격에 <font color=\"#8B008B\">독</font> 효과가 적용됩니다 (<font color=\"#FFFFFF\">5초간</font> <font color=\"#FFFFFF\">초당 5</font> 피해)."
PerkUpgradeDescription5="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">고르곤의 독</font> - 적 처치 시 <font color=\"#FFFFFF\">15m</font> 내의 적들에게 <font color=\"#8B008B\">독</font>이 퍼집니다."
PerkUpgradeDescription6="<font color=\"#8B008B\">독 피해</font>를 <font color=\"#FFFFFF\">100</font> 입힐 때마다 <font color=\"#FFD700\">뱀 비늘</font>을 1개 획득합니다 (비늘당 <font color=\"#FFFFFF\">저항력 +3%</font>, <font color=\"#FFFFFF\">속도 +2%</font>). <font color=\"#FFFFFF\">비늘 6개</font> 달성 시: <font color=\"#FFD700\">풀 고르곤</font> 상태가 됩니다 (<font color=\"#FFFFFF\">독 피해 +100%</font>)."

[DKUpgrade_Perk_Metronome]
UpgradeName="메트로놈"
PerkUpgradeDescription1="위상은 <font color=\"#ff4444\">ASSAULT</font>, <font color=\"#44ddff\">TEMPO</font>, <font color=\"#44ff44\">MOMENTUM</font>, <font color=\"#ffaa22\">BASTION</font> 순으로 자동 순환됩니다. 각 위상마다 고유한 보너스가 부여됩니다."
PerkUpgradeDescription2="<font color=\"#ff4444\">돌격</font>: 레벨당 피해량 <font color=\"#FFFFFF\">+1.5%</font> 및 관통력 <font color=\"#FFFFFF\">+1.25%</font>. 동기화 조건: <font color=\"#FFFFFF\">헤드샷 처치</font>."
PerkUpgradeDescription3="<font color=\"#44ddff\">템포</font>: 레벨당 재장전 속도 <font color=\"#FFFFFF\">+1%</font> 및 연사 속도 <font color=\"#FFFFFF\">+1%</font>. 동기화 조건: <font color=\"#FFFFFF\">빠른 연속 처치</font> (3초 이내)."
PerkUpgradeDescription4="<font color=\"#44ff44\">모멘텀</font>: 레벨당 이동 속도 <font color=\"#FFFFFF\">+0.75%</font> 및 무기 전환 속도 <font color=\"#FFFFFF\">+1.5%</font>. 동기화 조건: <font color=\"#FFFFFF\">이동 중 처치</font>."
PerkUpgradeDescription5="<font color=\"#ffaa22\">BASTION</font>: 레벨당 근접 피해량 <font color=\"#FFFFFF\">+1%</font>, 처치 시 <font color=\"#FFFFFF\">1 HP 회복</font>, 피해 저항 <font color=\"#FFFFFF\">15%</font>. 동기화 조건: <font color=\"#FFFFFF\">근거리 처치</font> (5m 미만)."
PerkUpgradeDescription6="각 위상과 일치하는 조건으로 <font color=\"#FFFFFF\">5회 동기화 처치</font>를 달성하면, 해당 위상에 <font color=\"#77d914\">영구적인 +0.25%</font> 중첩 보너스가 부여됩니다."
PerkUpgradeDescription7="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">조화</font> - 위상이 전환될 때 잠시 겹치며 <font color=\"#FFFFFF\">두 위상의 보너스</font>가 동시에 적용됩니다."
PerkUpgradeDescription8="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">크레센도</font> - 동기화를 높게 유지하며 전체 사이클을 완료하면, <font color=\"#FFFFFF\">모든 위상의 보너스가 한 번에 활성화됩니다.</font>"

[DKUpgrade_Perk_Omen]
UpgradeName="징조"
PerkUpgradeDescription1="<font color=\"#ebc034\">징조의 시선:</font> <font color=\"#ebc034\">피해량</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription2="<font color=\"#ebc034\">어둠 저항력:</font> <font color=\"#ebc034\">피해 저항</font> <font color=\"#FFFFFF\">레벨업당 +0.5% · 만렙(Lv20) +10%</font>"
PerkUpgradeDescription3="<font color=\"#ebc034\">운명적인 정밀도:</font> <font color=\"#ebc034\">헤드샷 피해량</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription4="<font color=\"#ebc034\">예언:</font> 매 웨이브마다 <font color=\"#77d914\">축복</font> 도전이 주어집니다. 이를 완료하면 <font color=\"#15d7fa\">영구적인 버프</font>를 얻지만, 실패하면 <font color=\"#ff0000\">보상의 두 배에 달하는 강력한 저주</font>를 받습니다."
PerkUpgradeDescription5="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">공포의 환영</font> - 더 어려운 예언이 추가됩니다. 예언 실패 시, <font color=\"#15d7fa\">파멸의 저항력</font>을 얻습니다 (<font color=\"#FFFFFF\">20초</font> 동안 피해량 <font color=\"#FFFFFF\">+15%</font>)."
PerkUpgradeDescription6="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">운명의 설계자</font> - 극한의 예언이 추가됩니다. 5 웨이브마다 1회 <font color=\"#15d7fa\">운명 거부</font>를 사용할 수 있습니다. 누적된 모든 보상이 <font color=\"#FFFFFF\">+50%</font> 증가합니다."

[DKUpgrade_Perk_Parasite]
UpgradeName="기생충"
PerkUpgradeDescription1="<font color=\"#B40028\">피의 십일조:</font> <font color=\"#FF6464\">모든 피해량에 비례하여 체력 흡수</font> <font color=\"#FFFFFF\">레벨업당 +0.5% · 만렙(Lv20) +10%</font> (타격당 최대 <font color=\"#FFFFFF\">5 HP</font>)"
PerkUpgradeDescription2="<font color=\"#B40028\">생명력 추출:</font> <font color=\"#FF6464\">치유량</font> <font color=\"#FFFFFF\">레벨업당 +0.75% · 만렙(Lv20) +15%</font>"
PerkUpgradeDescription3="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">흡수 네트워크</font> - 모든 피해에 <font color=\"#B40028\">흡수</font> 효과가 적용됩니다. 흡수된 적 1명당 <font color=\"#FFFFFF\">+2%</font>의 추가 피해량을 얻습니다 (최대 <font color=\"#FFFFFF\">8명</font>). 아군을 치유할 때, 흡수된 적에게도 치유량의 <font color=\"#FFFFFF\">25%</font>만큼 피해를 줍니다."
PerkUpgradeDescription4="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">크림슨 타이드</font> - 3명 이상의 적을 흡수하는 동안 <font color=\"#B40028\">출혈의 파동</font>이 충전됩니다. <font color=\"#FFFFFF\">20중첩</font> 시: 광역 흡수로 아군을 회복시키고 <font color=\"#FFFFFF\">8초</font> 동안 <font color=\"#FF6464\">체력 흡수량</font>이 두 배가 됩니다."

[DKUpgrade_Perk_Predator]
UpgradeName="프레데터"
PerkUpgradeDescription1="<font color=\"#CC8800\">사냥꾼의 본능:</font> 등급당 <font color=\"#FF6666\">모든 피해량</font> <font color=\"#FFFFFF\">+0.75%</font>"
PerkUpgradeDescription2="<font color=\"#CC8800\">트로피 헌터:</font> 좀비를 처치하면 확률적으로 <font color=\"#FFD700\">트로피</font>를 획득합니다. 알맞은 트로피를 모아 <font color=\"#87CEEB\">세트</font>를 완성하면(최대 <font color=\"#FFFFFF\">3개</font>) 영구적인 보너스를 획득합니다."
PerkUpgradeDescription3="<font color=\"#87CEEB\">티어 1 (2세트):</font> <font color=\"#FFD700\">스웜 브레이커</font> (클롯+크롤러: <font color=\"#FFFFFF\">이동 속도 +15%</font>) / <font color=\"#FFD700\">블레이드 컬렉터</font> (고어패스트+스토커: <font color=\"#FFFFFF\">근접 공격력 +30%</font>) / <font color=\"#FFD700\">프릭 쇼</font> (사이렌+허스크: <font color=\"#FFFFFF\">피해 저항 +25%</font>) / <font color=\"#FFD700\">샐비지 런</font> (EDAR+블로트: <font color=\"#FFFFFF\">재장전 속도 +25%</font>) / <font color=\"#FFD700\">대형 게임</font> (스크레이크+FP: <font color=\"#FFFFFF\">대형 좀비 피해량 +25%</font>)"
PerkUpgradeDescription4="<font color=\"#87CEEB\">티어 2 (3세트):</font> <font color=\"#FFD700\">풀 스윕</font> (클롯+고어패스트+크롤러: <font color=\"#FFFFFF\">탄창 크기 +30%</font>) / <font color=\"#FFD700\">나이트 스토커</font> (스토커+사이렌+EDAR: <font color=\"#FFFFFF\">무기 전환 속도 +40%</font>) / <font color=\"#FFD700\">브루트 포스</font> (허스크+스크레이크+FP: <font color=\"#FFFFFF\">모든 피해량 +20%</font>)"
PerkUpgradeDescription5="<font color=\"#87CEEB\">티어 3 (보스+):</font> <font color=\"#FFD700\">킹 슬레이어</font> (보스+FP: <font color=\"#FFFFFF\">피해량 +50%, 저항 +30%, 잡기 면역</font>) / <font color=\"#FFD700\">에이펙스 프레데터</font> (보스+스크레이크: <font color=\"#FFFFFF\">피해량 +40%, 이동 속도 +30%, 적 체력 확인</font>) / <font color=\"#FFD700\">트로피 월</font> (보스+아무거나: <font color=\"#FFFFFF\">피해량 +30%, 탄약 +50%, 재장전 +30%</font>)"
PerkUpgradeDescription6="<font color=\"#87CEEB\">티어 4:</font> <font color=\"#FFD700\">전설의 사냥꾼</font> (보스+보스: <font color=\"#FFFFFF\">피해량 +75%, 저항 +50%, 속도 +50%, 잡기 면역, 체력 확인, 최대 체력 +50</font>)"
PerkUpgradeDescription7="<font color=\"#CC8800\">무한 사냥:</font> <font color=\"#FFFFFF\">3</font>세트를 완성한 후 트로피는 <font color=\"#FFD700\">무한히</font> 중첩되며 <font color=\"#FFFFFF\">5</font>개의 슬롯에 저장됩니다. (중첩당: <font color=\"#87CEEB\">클롯</font> 웨이브당 +1 도쉬 / <font color=\"#87CEEB\">크롤러</font> 속도 +1% / <font color=\"#87CEEB\">고어패스트</font> 근접 공격력 +1% / <font color=\"#87CEEB\">스토커</font> 탄창 용량 +1% / <font color=\"#87CEEB\">블로트</font> 최대 체력 +1 / <font color=\"#87CEEB\">허스크</font> 받는 피해 -1% / <font color=\"#87CEEB\">사이렌</font> 탄약 +5% / <font color=\"#87CEEB\">EDAR</font> 헤드샷 피해 +10% / <font color=\"#87CEEB\">스크레이크</font> 방어력 +5 / <font color=\"#87CEEB\">FP</font> 모든 피해량 +10%)"
PerkUpgradeDescription8="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">날카로운 눈</font> - 트로피 <font color=\"#FFFFFF\">드롭 확률</font>이 <font color=\"#87CEEB\">두 배</font>가 됩니다."
PerkUpgradeDescription9="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">트로피 마스터</font> - 트로피 드롭률이 <font color=\"#FFFFFF\">5%</font>로 고정되며, 모든 <font color=\"#87CEEB\">세트 보너스가 두 배로 증가합니다</font>. <font color=\"#FFD700\">전설의 사냥꾼</font> 세트에 <font color=\"#FF6666\">최대 체력 +50</font>이 추가됩니다."

[DKUpgrade_Perk_Pyrokinetic]
UpgradeName="열역학"
PerkUpgradeDescription1="모든 무기가 <font color=\"#77d914\">레벨업당 +1% · 만렙(Lv20) +20%</font> 확률로 사격 시 <font color=\"#ffa000\">테르밋탄</font>을 발사합니다."
PerkUpgradeDescription2="당신의 <font color=\"#ff1f0f\">화상</font> 효과가 <font color=\"#77d914\">레벨업당 +1.25% · 만렙(Lv20) +25%</font> 더 많은 피해를 입힙니다."
PerkUpgradeDescription3="당신의 <font color=\"#ff1f0f\">화상</font> 효과가 <font color=\"#77d914\">레벨업당 +1.25% · 만렙(Lv20) +25%</font> 더 오래 지속됩니다."

[DKUpgrade_Perk_Reaper]
UpgradeName="사신"
PerkUpgradeDescription1="<font color=\"#CC0000\">죽음의 정밀도:</font> <font color=\"#FF6666\">치명타 확률</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription2="<font color=\"#CC0000\">소울 스트라이크:</font> <font color=\"#FF6666\">헤드샷 피해량</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription3="<font color=\"#CC0000\">섀도우 스텝:</font> <font color=\"#FF6666\">이동 속도</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription4="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">리퍼의 승천</font> - <font color=\"#FF6666\">추가 피해량</font> <font color=\"#FFFFFF\">+12.5%</font>"
PerkUpgradeDescription5="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">죽음의 손길</font> - 타격 시 <font color=\"#FFFFFF\">5%</font> 확률로 <font color=\"#FF6666\">즉시 처치</font>합니다."
PerkUpgradeDescription6="<font color=\"#FFD700\">영혼 수확</font>: <font color=\"#FFFFFF\">100킬</font>마다 <font color=\"#FFFFFF\">100 도쉬</font>를 획득합니다."

[DKUpgrade_Perk_Riot]
UpgradeName="폭동"
PerkUpgradeDescription1="<font color=\"#FF4500\">브롤러즈 엣지:</font> 레벨당 <font color=\"#FFB347\">근접 공격력</font> <font color=\"#FFFFFF\">+1.25%</font>, <font color=\"#FFB347\">피해 저항</font> <font color=\"#FFFFFF\">+0.5%</font>, <font color=\"#FFB347\">공격 속도</font> <font color=\"#FFFFFF\">+0.75%</font>"
PerkUpgradeDescription2="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">격돌의 한가운데</font> - 5m 이내의 적 하나당 근접 공격력이 1%, 피해 저항이 2.5% 증가합니다 (최대 5명)."
PerkUpgradeDescription3="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">폭동 진압</font> - 주변에 적이 <font color=\"#FFFFFF\">3명 이상</font>일 경우 <font color=\"#FFB347\">넘어짐에 면역</font>이 되며, <font color=\"#FFFFFF\">5명 이상</font>일 경우 이동 속도가 <font color=\"#FFFFFF\">+15%</font>, 공격 속도가 <font color=\"#FFFFFF\">+10%</font> 증가합니다."
PerkUpgradeDescription4="이 군중 보너스는 적이 사거리를 벗어난 후에도 3초 동안 지속됩니다."

[DKUpgrade_Perk_Scavenger]
UpgradeName="스캐빈저"
PerkUpgradeDescription1="<font color=\"#DAA520\">연습 재장전:</font> <font color=\"#F0C868\">재장전 속도</font> <font color=\"#FFFFFF\">레벨업당 +1.5% · 만렙(Lv20) +30%</font>"
PerkUpgradeDescription2="<font color=\"#DAA520\">빠른 뽑기:</font> <font color=\"#F0C868\">무기 전환 속도</font> <font color=\"#FFFFFF\">레벨업당 +2% · 만렙(Lv20) +40%</font>"
PerkUpgradeDescription3="<font color=\"#DAA520\">가벼운 발걸음:</font> <font color=\"#F0C868\">이동 속도</font> <font color=\"#FFFFFF\">레벨업당 +1% · 만렙(Lv20) +20%</font>"
PerkUpgradeDescription4="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">전장 약탈자</font> - 처치 시 <font color=\"#FFFFFF\">10%</font> 확률로 예비 탄약을 <font color=\"#FFFFFF\">30</font> 획득하며, <font color=\"#F0C868\">은폐한 적</font>을 볼 수 있습니다."
PerkUpgradeDescription5="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">마스터 생존자</font> - <font color=\"#F0C868\">피해량</font> <font color=\"#FFFFFF\">+12.5%</font> 및 <font color=\"#F0C868\">탄창 용량</font> <font color=\"#FFFFFF\">+30%</font>"
PerkUpgradeDescription6="<font color=\"#FFD700\">활용도 학습</font>: 50킬마다 무작위로 영구적인 <font color=\"#FFFFFF\">예비 탄약 +5%</font> 또는 <font color=\"#F0C868\">탄창 용량 +5%</font>를 획득합니다."

[DKUpgrade_Perk_Shapeshifter]
UpgradeName="변신술사"
PerkUpgradeDescription1="<font color=\"#c77dff\">변신술사:</font> 각 웨이브마다 레벨에 비례하는 <font color=\"#e0aaff\">무작위 전투 버프</font>를 1개 부여받습니다."
PerkUpgradeDescription2="<font color=\"#8B0000\">레벨 10:</font> <font color=\"#FFD700\">듀얼 폼</font> - 이제 웨이브당 <font color=\"#e0aaff\">2개의 버프</font>를 받습니다."
PerkUpgradeDescription3="<font color=\"#8B0000\">레벨 20:</font> <font color=\"#FFD700\">모방</font> - 얻은 버프가 <font color=\"#e0aaff\">영구적으로 중첩됩니다</font>. 총 <font color=\"#FFFFFF\">15개</font>의 버프를 모두 모으면 최고 숙련도를 달성합니다."

[DKUpgrade_Perk_SpecialAgent]
