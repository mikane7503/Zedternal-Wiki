DeluxeSkillUpgradeDescription="모든 무기의 <font color=\"#ff3399\">헤드샷 피해량</font>이 <font color=\"#66cc00\">+40%</font> 증가합니다."

[DKUpgrade_Skill_DealWithTheDevil]
UpgradeName="악마와의 거래"
StandardSkillUpgradeDescription="<font color=\"#962ab9\">치유량</font>이 -85% 감소하는 대신, <font color=\"#42e087\">모든 무기의 헤드샷 피해량</font>이 +30% 증가합니다."
DeluxeSkillUpgradeDescription="<font color=\"#962ab9\">치유량</font>이 -70% 감소하는 대신, <font color=\"#42e087\">모든 무기의 헤드샷 피해량</font>이 +50% 증가합니다."

[DKUpgrade_Skill_DeathChill]
UpgradeName="데스 칠"
StandardSkillUpgradeDescription="<font color=\"#4682B4\">죽음의 냉기:</font> 5번째 처치마다 대상의 시체에서 <font color=\"#FFFFFF\">냉기 폭발</font>이 일어납니다. 처치 카운트는 <font color=\"#F0F8FF\">8초</font> 후에 초기화됩니다."
DeluxeSkillUpgradeDescription="<font color=\"#4682B4\">죽음의 냉기:</font> 3번째 처치마다 대상의 시체에서 <font color=\"#FFFFFF\">강력한 냉동 폭발</font>이 일어납니다. 처치 카운트는 <font color=\"#F0F8FF\">8초</font> 후에 초기화됩니다."

[DKUpgrade_Skill_DeathSentence]
UpgradeName="사형 선고"
StandardSkillUpgradeDescription="<font color=\"#CC0000\">사형 선고:</font> 체력이 <font color=\"#FFFFFF\">+40%</font> 미만인 적을 공격 시 <font color=\"#FFFFFF\">+30%</font>의 <font color=\"#FFD700\">추가 피해</font>를 입힙니다. 시작한 일의 끝을 맺으십시오."
DeluxeSkillUpgradeDescription="<font color=\"#CC0000\">사형 선고:</font> 체력이 <font color=\"#FFFFFF\">+80%</font> 미만인 적을 공격 시 <font color=\"#FFFFFF\">+40%</font>의 <font color=\"#FFD700\">추가 피해</font>를 입힙니다. 시작한 일의 끝을 맺으십시오."

[DKUpgrade_Skill_DeathlessFury]
