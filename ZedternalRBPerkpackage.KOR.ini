PerkUpgradeDescription9="<font color=\"#FFD700\">적응형 변이</font>: 100킬을 달성할 때마다 무작위로 영구적인 <font color=\"#7FFF7F\">능력치 증가</font>를 얻으며, 이는 무한히 중첩됩니다."

[DKUpgrade_Perk_Taskmaster]
