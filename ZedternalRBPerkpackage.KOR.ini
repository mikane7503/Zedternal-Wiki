PerkUpgradeDescription3="<font color=\"#15d7fa\">재장전 속도</font>가 <font color=\"#77d914\">레벨업당 +1.5% · 만렙(Lv20) +30%</font> 증가합니다."

[DKUpgrade_Perk_Symbiote]
