[ZedternalTempered.ZTAISpawnManager]
; Comma-separated values for players 1, 2, 3, etc. Append values for up to
; 128 players. Counts beyond the final entry use that final value.
MaxMonsters_PerPlayer=12,18,22,26,28,32
; Wave 1 uses the player value above. Each later wave adds its range's
; IncreasePerWave, cumulatively. Gaps add 0; overlapping ranges stack.
MaxMonsters_WaveIncrease=(MinWave=1,MaxWave=5,IncreasePerWave=1)
MaxMonsters_WaveIncrease=(MinWave=6,MaxWave=10,IncreasePerWave=2)
MaxMonsters_WaveIncrease=(MinWave=11,MaxWave=15,IncreasePerWave=0)

; Regular-wave total is independent of individual ZED values. Six-player
; counts are linearly interpolated between these ascending wave anchors.
; After the final anchor, the last segment's slope continues (up to the
; Wave_MaxNumberOfZedsToSpawn cap in KFZedternalReborn_ZedWaves.ini).
